[package]
name = "tree_similarity_extension"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
memchr = "2.7.4"
pgrx = "0.18.0"
rustc-hash = "2.0.0"
serde = { version = "1.0.207", features = ["derive"] }
thiserror = "2.0.18"
cxx = { version = "1.0.126", features = ["c++17"] }
serde_json = "1.0.128"

[dev-dependencies]
pgrx-tests = "0.18.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

[build-dependencies]
cxx-build = "1.0"
