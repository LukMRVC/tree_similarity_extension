[package]
name = "tree_similarity_extension"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []
pg_bench = ["dep:pgrx-bench"]


[dependencies]
libc = "0.2"
memchr = "2.7.4"
pgrx = "0.19.1"
rustc-hash = "2.0.0"
twox-hash = { version = "2.1.4", default-features = false, features = ["std", "xxhash3_64"] }
serde = { version = "1.0.207", features = ["derive"] }
thiserror = "2.0.18"
cxx = { version = "1.0.126", features = ["c++17"] }
serde_json = "1.0.128"
pgrx-bench = { version = "0.19.1", optional = true }

[dev-dependencies]
pgrx-tests = "0.19.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
# macOS `strip` can emit a dylib that dyld rejects ("mis-aligned LINKEDIT string pool").
strip = false

[build-dependencies]
cxx-build = "1.0"
